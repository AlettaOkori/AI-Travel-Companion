<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>行前规划 · 交互演示</title>
<style>
  :root {
    --bg: oklch(97% 0.004 250);
    --bg-elevated: oklch(99% 0.002 250);
    --surface: oklch(100% 0 0);
    --surface-2: oklch(96% 0.006 250);
    --surface-3: oklch(92% 0.008 250);
    --fg: oklch(18% 0.025 250);
    --fg-dim: oklch(34% 0.018 250);
    --muted: oklch(46% 0.018 250);
    --muted-2: oklch(56% 0.014 250);
    --border: oklch(88% 0.008 250);
    --border-strong: oklch(78% 0.012 250);
    --accent: oklch(56% 0.20 255);
    --accent-dim: oklch(56% 0.20 255 / 0.10);
    --accent-glow: oklch(56% 0.20 255 / 0.25);
    --accent-warm: oklch(56% 0.14 48);
    --accent-warm-dim: oklch(56% 0.14 48 / 0.12);
    --accent-warm-glow: oklch(56% 0.14 48 / 0.28);
    --accent-warm-deep: oklch(40% 0.11 48);
    --success: oklch(58% 0.16 145);
    --success-dim: oklch(58% 0.16 145 / 0.12);
    --warn: oklch(72% 0.16 75);
    --font-display: -apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',system-ui,sans-serif;
    --font-body: -apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC',system-ui,sans-serif;
    --font-mono: 'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
    --font-serif: 'Songti SC','STSong','Source Han Serif CN','SimSun',Georgia,serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e8e9ec; color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; padding: 20px; }

  /* iPhone 15 Pro frame */
  .iphone {
    width: 390px; height: 844px; background: var(--surface); border-radius: 56px;
    border: 1px solid #d4d5d9; position: relative; overflow: hidden;
    box-shadow: 0 24px 60px -16px rgba(0,0,0,.12), 0 0 0 6px #f0f0f2;
    user-select: none; -webkit-user-select: none;
  }
  .iphone::before { content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #1a1a1a; border-radius: 20px; z-index: 50; }
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px;
    padding: 16px 30px 0; display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-display); font-size: 17px; font-weight: 600; z-index: 40; pointer-events: none; color: var(--fg);
  }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; background: var(--fg); border-radius: 3px; opacity: .2; z-index: 50; }
  .screen { position: absolute; inset: 0; padding-top: 54px; padding-bottom: 28px; overflow: hidden; display: flex; flex-direction: column; }

  /* Pretrip layout */
  .pretrip { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .pretrip header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--surface); }
  .avatar-brand { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 1px solid var(--border); background: var(--surface); }
  .avatar-brand img { width: 100%; height: 100%; object-fit: cover; }
  .head-meta { flex: 1; }
  .head-meta b { font-size: 15px; font-weight: 600; display: block; }
  .head-meta .tag { font-size: 10px; color: var(--accent); font-family: var(--font-mono); letter-spacing: 0.08em; }
  .messages { flex: 1; overflow-y: auto; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; cursor: pointer; }
  .msg { max-width: 82%; padding: 12px 16px; border-radius: 18px; font-size: 14.5px; line-height: 1.6; box-shadow: 0 1px 2px rgba(0,0,0,.04); animation: msgIn .35s ease-out both; }
  .msg.ai { background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-top-left-radius: 6px; align-self: flex-start; }
  .msg.user { background: var(--accent); color: #fff; border-top-right-radius: 6px; align-self: flex-end; font-weight: 500; }
  .msg-meta { font-family: var(--font-mono); font-size: 10px; color: var(--muted-2); margin: 2px 8px 0; animation: fadeIn .3s ease .2s both; }
  .typing { display: flex; gap: 4px; padding: 12px 16px; background: var(--surface); border-radius: 18px; border-top-left-radius: 6px; align-self: flex-start; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted-2); animation: typing 1.4s infinite; }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes typing { 0%,60%,100%{opacity:.3;transform:translateY(0)} 30%{opacity:1;transform:translateY(-3px)} }
  @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .input-bar { padding: 10px 12px 8px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; background: var(--surface); pointer-events: none; opacity: .6; }
  .input-bar .mic { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); display: grid; place-items: center; color: var(--fg-dim); flex-shrink: 0; }
  .input-bar .box { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .input-bar .send { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: #fff; flex-shrink: 0; box-shadow: 0 2px 8px var(--accent-glow); }

  /* Click hint overlay */
  .click-hint {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    padding: 8px 18px; background: rgba(0,0,0,.65); color: #fff; font-size: 13px;
    border-radius: 20px; pointer-events: none; z-index: 30; white-space: nowrap;
    animation: hintPulse 2s infinite; backdrop-filter: blur(8px);
  }
  @keyframes hintPulse { 0%,100%{opacity:.85} 50%{opacity:.45} }
  .click-hint.hide { opacity: 0; transition: opacity .3s; }

  /* Progress dots */
  .progress-dots { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; z-index: 30; pointer-events: none; }
  .progress-dots .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border-strong); transition: background .3s; }
  .progress-dots .dot.on { background: var(--accent); }

  /* Cards */
  .check-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; max-width: 94%; align-self: flex-start; box-shadow: 0 2px 8px rgba(0,0,0,.04); animation: msgIn .4s ease-out both; }
  .check-head { padding: 12px 16px; border-bottom: 1px solid var(--border); background: linear-gradient(90deg, var(--accent-dim), transparent); }
  .check-head b { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .check-head b::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .check-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .check-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-dim); transition: color .3s, text-decoration .3s; }
  .check-item.done { color: var(--muted); text-decoration: line-through; }
  .check-item .cb { width: 18px; height: 18px; border-radius: 6px; border: 2px solid var(--border-strong); flex-shrink: 0; display: grid; place-items: center; font-size: 11px; color: #fff; transition: background .3s, border-color .3s; }
  .check-item.done .cb { background: var(--success); border-color: var(--success); }
  .check-item .cb::after { content: ''; }
  .check-item.done .cb::after { content: '✓'; }

  .rec-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; max-width: 94%; align-self: flex-start; box-shadow: 0 2px 8px rgba(0,0,0,.04); animation: msgIn .4s ease-out both; }
  .rec-head { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .rec-head b { font-size: 14px; font-weight: 600; }
  .rec-head span { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
  .rec-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .rec-option { padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-elevated); }
  .rec-option.on { border-color: var(--accent); background: var(--accent-dim); }
  .rec-option .name { font-size: 14px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
  .rec-option .detail { font-size: 12px; color: var(--fg-dim); line-height: 1.5; }
  .rec-option .badge { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-family: var(--font-mono); background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
  .rec-option.on .badge { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-dim); }

  .route-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; max-width: 94%; align-self: flex-start; box-shadow: 0 2px 8px rgba(0,0,0,.04); animation: msgIn .4s ease-out both; }
  .route-head { padding: 12px 16px; border-bottom: 1px solid var(--border); background: linear-gradient(90deg, var(--accent-warm-dim), transparent); }
  .route-head b { font-size: 14px; font-family: var(--font-serif); font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .route-head b::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-warm); }
  .route-body { padding: 12px 16px; }
  .day-block { margin-bottom: 12px; }
  .day-block:last-child { margin-bottom: 0; }
  .day-title { font-size: 12px; font-family: var(--font-mono); color: var(--accent); letter-spacing: 0.08em; margin-bottom: 6px; }
  .day-list { display: flex; flex-direction: column; gap: 6px; }
  .day-item { font-size: 13px; color: var(--fg-dim); line-height: 1.5; padding-left: 12px; position: relative; }
  .day-item::before { content: '·'; position: absolute; left: 0; color: var(--muted-2); }
  .day-item b { color: var(--fg); font-weight: 500; }

  .weather-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; max-width: 94%; align-self: flex-start; box-shadow: 0 2px 8px rgba(0,0,0,.04); animation: msgIn .4s ease-out both; }
  .weather-head { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .weather-head b { font-size: 14px; font-weight: 600; }
  .weather-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  .w-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  .w-row .day { color: var(--fg-dim); }
  .w-row .cond { color: var(--fg); font-weight: 500; }
  .w-row .temp { font-family: var(--font-mono); color: var(--accent); }
  .w-tip { margin-top: 4px; padding: 10px; background: var(--bg-elevated); border-radius: 10px; font-size: 12px; color: var(--fg-dim); line-height: 1.5; }

  .pack-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pack-col { background: var(--bg-elevated); border-radius: 10px; padding: 10px; }
  .pack-col b { font-size: 11px; font-family: var(--font-mono); color: var(--accent); letter-spacing: 0.06em; display: block; margin-bottom: 6px; }
  .pack-col ul { list-style: none; font-size: 12px; color: var(--fg-dim); line-height: 1.7; }

  .itinerary { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; max-width: 96%; align-self: flex-start; box-shadow: 0 4px 16px rgba(0,0,0,.06); position: relative; animation: msgIn .5s ease-out both; }
  .itinerary::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--accent); }
  .iti-head { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .iti-head .brand-ico { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); }
  .iti-head .brand-ico img { width: 100%; height: 100%; object-fit: cover; }
  .iti-head .info { flex: 1; }
  .iti-head .info b { font-size: 16px; font-weight: 600; display: block; }
  .iti-head .info span { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
  .iti-body { padding: 14px 16px; }
  .iti-sec { margin-bottom: 14px; }
  .iti-sec:last-child { margin-bottom: 0; }
  .iti-sec h5 { font-size: 11px; font-family: var(--font-mono); color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .iti-sec h5::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .iti-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-dim); margin-bottom: 6px; }
  .iti-row b { color: var(--fg); font-weight: 500; }
  .iti-row .tag { padding: 2px 8px; border-radius: 6px; font-size: 11px; font-family: var(--font-mono); background: var(--accent-dim); color: var(--accent); }
  .iti-checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .iti-checks label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-dim); cursor: pointer; }
  .iti-checks input { accent-color: var(--accent); }
  .iti-foot { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .iti-foot button { flex: 1; padding: 10px; border-radius: 12px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  .iti-foot .btn-primary { background: var(--accent); color: #fff; }
  .iti-foot .btn-secondary { background: var(--surface-2); color: var(--fg); border: 1px solid var(--border); }

  .scroll-hint { text-align: center; font-size: 11px; color: var(--muted-2); padding: 8px; font-family: var(--font-mono); letter-spacing: 0.06em; animation: fadeIn .5s ease both; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<div class="iphone" id="iphone">
  <div class="status-bar"><span>9:41</span><span style="display:flex;gap:5px;align-items:center;"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 0C4.5 0 1.5 1.5 0 4l1.5 1.5C2.5 3.5 5 2.5 8 2.5s5.5 1 6.5 3L16 4C14.5 1.5 11.5 0 8 0z"/><path d="M8 5c-2 0-3.5.8-4.5 2L5 8.5C5.5 7.5 6.5 7 8 7s2.5.5 3 1.5L12.5 7C11.5 5.8 10 5 8 5z"/><circle cx="8" cy="11" r="1"/></svg><svg width="27" height="13" viewBox="0 0 27 13" fill="currentColor"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1"/><rect x="2" y="2" width="15" height="8" rx="1"/><rect x="22" y="4" width="2" height="4" rx="0.5"/></svg></span></div>
  <div class="home-indicator"></div>
  <div class="screen">
    <div class="pretrip">
      <header>
        <div class="avatar-brand"><img src="../assets/images/brand/ai_avatar.png" alt="AI 规划师" /></div>
        <div class="head-meta"><b>小游 · 旅行专属定制师</b><span class="tag">AI · 已为 12,847 人规划行程</span></div>
        <div style="font-size:20px;color:var(--muted);">􀍠</div>
      </header>

      <div class="progress-dots" id="progressDots"></div>

      <div class="messages" id="messages">
        <!-- Messages injected by JS -->
      </div>

      <div class="click-hint" id="clickHint">点击屏幕继续</div>

      <div class="input-bar">
        <div class="mic">􀊰</div>
        <div class="box">随时找我，24h 在线…</div>
        <div class="send">􀈠</div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const messagesEl = document.getElementById('messages');
  const clickHint = document.getElementById('clickHint');
  const progressDots = document.getElementById('progressDots');

  let currentStep = 0;
  let isAutoPlaying = false;
  let typingEl = null;

  // Conversation script
  const script = [
    // Step 0: Initial AI greeting (shown on load)
    { type: 'ai', content: '你好呀～我是你的旅行专属定制师！🙋‍♀️<br><br>从路线规划、门票预订、交通住宿到行李清单，我都能帮你安排得妥妥当当的！<br><br>先告诉我，你想去哪里旅行呢？' },

    // === Turn 1 ===
    { type: 'user', content: '我想去开平碉楼' },
    { type: 'ai', content: '好嘞！开平碉楼可是广东唯一的世界文化遗产，碉楼群 scattered 在稻田和村落之间，特别有电影感～🎬<br><br>给你快速划重点：<br>· <b>瑞石楼</b>——「开平第一楼」，9 层高，中西合璧的巅峰之作<br>· <b>立园</b>——华侨谢维立的私家花园，既有苏州园林的雅致，又有西洋喷泉的浪漫<br>· <b>赤坎古镇</b>——烟火气十足的骑楼老街，晚上灯光一亮超有氛围<br><br>作为你的旅行专属定制师，接下来我会一步步带你完成 <b>7 项出行准备</b>，确保你的旅程顺畅又省心～<br><br>咱们先从「住哪里」开始好不好？' },
    { type: 'card', subtype: 'checklist' },

    // === Turn 2 ===
    { type: 'user', content: '好呀' },
    { type: 'ai', content: '先问你两个小问题，好帮你筛出最合适的住处：<br><br>1. 你打算哪天入住、住几晚呀？<br>2. 更想住<b>古镇里的特色民宿</b>（早上推开窗就是骑楼街），还是<b>景区附近的舒适酒店</b>（出行方便、停车宽敞）？' },

    // === Turn 3 ===
    { type: 'user', content: '周五晚上到，住两晚，想住有特色一点的' },
    { type: 'ai', content: '收到！那我重点给你看赤坎古镇内的两家高口碑民宿👇' },
    { type: 'card', subtype: 'hotel' },
    { type: 'ai', content: '我个人更推荐 <b>塘口·此间民宿</b>，虽然贵一点，但天台的 view 真的值回票价，而且民宿主人是本地通，能给你很多非游客攻略～<br><br>你觉得呢？需要我帮你先锁一间吗？' },

    // === Turn 4 ===
    { type: 'user', content: '选 B 吧' },
    { type: 'ai', content: '好眼光！✨ 我帮你锁定 <b>塘口·此间民宿，周五/周六两晚</b>，保留 15 分钟。<br><br>订单号稍后一起汇总到行程卡里。<br><br>接下来咱们看「怎么去」～' },
    { type: 'ai', content: '你从哪里出发呀？高铁、飞机还是自驾？我可以直接帮你查实时班次和路况。' },

    // === Turn 5 ===
    { type: 'user', content: '从广州出发，高铁方便吗？' },
    { type: 'ai', content: '超方便！广州南 → 开平南，每天 <b>12 趟车次</b>，我帮你看了下周五傍晚的：' },
    { type: 'card', subtype: 'train' },
    { type: 'ai', content: '建议你搭 <b>C6931</b>，到开平南后打车 25 分钟到赤坎古镇，刚好赶得上民宿入住（他们前台到 21:00）。<br><br>如果你需要，我还可以帮你预约开平南站的接站车（平台合作司机，<b>¥45 一口价</b>，比出租车省 ¥15）。<br><br>需要我把这趟车加入行程吗？' },

    // === Turn 6 ===

  // Build progress dots
  function buildDots() {
    for (let i = 0; i < totalTurns; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' on' : '');
      progressDots.appendChild(d);
    }
  }

  function updateDots() {
    // Count how many user messages have been shown
    let userCount = 0;
    for (let i = 0; i <= currentStep; i++) {
      if (script[i].type === 'user') userCount++;
    }
    const dots = progressDots.querySelectorAll('.dot');
    dots.forEach((d, i) => {
      d.classList.toggle('on', i <= userCount);
    });
  }

    switch (subtype) {
      case 'checklist': renderChecklist(); break;
      case 'hotel': renderHotelCard(); break;
      case 'train': renderTrainCard(); break;
      case 'crowd': renderCrowdCard(); break;
      case 'route': renderRouteCard(); break;
      case 'packing': renderPackingCard(); break;
      case 'weather': renderWeatherCard(); break;
      case 'itinerary': renderItineraryCard(); break;
    }
  }

  function tickChecklist(index) {
    const items = messagesEl.querySelectorAll('.check-item');
    if (items[index]) {
      items[index].classList.add('done');
    }
  }

  // Core step renderer
  function renderStep(index) {
    const item = script[index];
    if (!item) return false;

    if (item.type === 'ai') {
      renderAIMessage(item.content);
      return true;
    }
    if (item.type === 'user') {
      renderUserMessage(item.content);
      return true;
    }
    if (item.type === 'card') {
      renderCard(item.subtype);
      return true;
    }
    if (item.type === 'scroll-hint') {
      const div = document.createElement('div');
      div.className = 'scroll-hint';
      div.textContent = item.content;
      messagesEl.appendChild(div);
      scrollToBottom();
      return true;
    }
    return false;
  }

  // Auto-advance AI messages after a user message
  async function autoAdvance() {
    if (isAutoPlaying) return;
    isAutoPlaying = true;
    clickHint.classList.add('hide');

    while (currentStep < script.length - 1) {
      const next = script[currentStep + 1];

      // Stop when we hit the next user message
      if (next.type === 'user') {
        break;
      }

      // Show typing before AI message
      if (next.type === 'ai') {
        showTyping();
        await delay(900 + Math.random() * 600);
        hideTyping();
      }

      currentStep++;
      renderStep(currentStep);
      updateDots();

      // Tick checklist items progressively
      if (next.type === 'card' && next.subtype === 'hotel') tickChecklist(0);
      if (next.type === 'card' && next.subtype === 'train') tickChecklist(1);
      if (next.type === 'card' && next.subtype === 'crowd') { tickChecklist(2); tickChecklist(3); }
      if (next.type === 'card' && next.subtype === 'route') tickChecklist(4);
      if (next.type === 'card' && next.subtype === 'packing') tickChecklist(5);
      if (next.type === 'card' && next.subtype === 'weather') tickChecklist(6);

      // Small pause between AI messages
      if (script[currentStep + 1] && script[currentStep + 1].type !== 'user') {
        await delay(400);
      }
    }

    isAutoPlaying = false;

    // Show hint if there's more
    if (currentStep < script.length - 1) {
      clickHint.classList.remove('hide');
    } else {
      clickHint.textContent = '演示结束';
      clickHint.classList.remove('hide');
    }
  }

  function delay(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  // Click handler: advances one user message, then auto-advances AI replies
  async function onClick() {
    if (isAutoPlaying) return;
    if (currentStep >= script.length - 1) return;

    const next = script[currentStep + 1];
    if (next.type !== 'user') return; // Safety

    // Hide hint
    clickHint.classList.add('hide');

    // Show user message
    currentStep++;
    renderStep(currentStep);
    updateDots();

    // Auto-advance AI replies
    await delay(300);
    autoAdvance();
  }

  // Init
  buildDots();
  renderStep(0); // Show initial AI greeting
  messagesEl.addEventListener('click', onClick);

  // Keyboard support for desktop demo
  document.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowRight') {
      e.preventDefault();
      onClick();
    }
  });
})();
</script>
