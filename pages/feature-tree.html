    }
    .btn-export:hover { background: #f5f5f5; }

    .legend {
      display: flex; flex-wrap: wrap; gap: 16px; justify-content: center;
      margin-bottom: 20px; font-size: 13px;
    }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;

    }
    .badge-done { background: #d4edda; color: #155724; }
    .badge-progress { background: #fff3cd; color: #856404; }
    .badge-todo { background: #e2e8f0; color: #475569; }

    .badge-medium { background: #fef3c7; color: #92400e; }
    .badge-complex { background: #fce7f3; color: #9d174d; }

    .panel { display: none; }
    .panel.active { display: block; }

      background: #fff; border-radius: 14px; padding: 20px 24px;

    }

      display: flex; align-items: center; gap: 10px;

    .section-title { font-size: 18px; font-weight: 700; }
    .section-desc { font-size: 13px; color: #555; margin-top: 2px; }

      margin: 12px 0 8px; padding-left: 8px; border-left: 3px solid #2563eb;
    }

      border: 1px solid #e8e8e8; border-radius: 10px; padding: 14px 16px;
      margin-bottom: 8px; background: #fafafa;
    }
    .feat-item.parent { background: #f0f4ff; border-color: #c7d7fe; }
    .feat-item-head {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px;

    .feat-name { font-size: 15px; font-weight: 600; flex: 1; }
    .feat-points { margin-left: 56px; }
    .feat-points li {

    .feat-anchor {

    th, td {
      border: 1px solid #e2e8f0; padding: 8px 10px; text-align: left;

    th { background: #f8fafc; font-weight: 700; white-space: nowrap; position: sticky; top: 0; }
    tr:nth-child(even) td { background: #fafafa; }

    .summary-bar {

    /* ── 商城 ── */
    { id:'M-01', tab:'商城', group:'商城 · 文创消费', parent:null, name:'文创商城', complexity:'中', status:'done',
      planning:['按景点切换商品列表','筛选（文创/纪念/书籍等）','排序（默认/价格）','商品详情','加购/立即购买','购物车角标与改数量','结算页演示（无真支付）'],
      technical:['#tab-shop','SHOP_DATA','renderShop()/renderShopGrid()','openShopDetail()/openCart()','localStorage 购物车','showToast()'],
      anchor:'SHOP_DATA · renderShop()' },
  ];

  const STATUS_LABEL = { done:'已完成', progress:'部分完成', todo:'占位/待开发' };
  const STATUS_CLASS = { done:'badge-done', progress:'badge-progress', todo:'badge-todo' };
  const COMPLEX_LABEL = { '简':'简', '中':'中', '复':'复' };
  const COMPLEX_CLASS = { '简':'badge-simple', '中':'badge-medium', '复':'badge-complex' };

  const GROUP_ORDER = [
    '通用','行前 · 规划对话','行前 · 决策卡片','行前 · 导游选择','行前 · 闭环',
    '行中 · 导览工作台','行中 · 形态与触达','行中 · 商业触达','行中 · 行程管理',
    '行后 · 收获展示','行后 · 知识沉淀','行后 · 扩展占位','商城 · 文创消费'
  ];

  function badge(cls, text) {
    return '<span class="badge ' + cls + '">' + text + '</span>';
  }

  function renderFeatItem(f, mode) {
    const points = mode === 'plan' ? f.planning : f.technical;
    const isParent = !f.parent && FEATURES.some(c => c.parent === f.id);
    const parentClass = (f.id === 'D-00' || isParent) ? ' parent' : '';
    const pointLabel = mode === 'plan' ? '策划功能点' : '技术功能点';
    let html = '<div class="feat-item' + parentClass + '">';
    html += '<div class="feat-item-head">';
    html += '<span class="feat-id">' + f.id + '</span>';
    html += '<span class="feat-name">' + f.name + '</span>';
    html += badge(STATUS_CLASS[f.status], STATUS_LABEL[f.status]);
    html += badge(COMPLEX_CLASS[f.complexity], COMPLEX_LABEL[f.complexity]);
    html += '<span style="font-size:12px;color:#666">' + f.tab + '</span>';
    html += '</div>';
    html += '<ul class="feat-points">';
    points.forEach(p => { html += '<li>' + p + '</li>'; });
    html += '</ul>';
    if (mode === 'tech') {
      html += '<div class="feat-anchor">锚点: ' + f.anchor + '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderTree(mode) {
    const sectionMap = {};
    GROUP_ORDER.forEach(g => { sectionMap[g] = []; });
    FEATURES.forEach(f => {
      if (f.parent) return;
      if (sectionMap[f.group]) sectionMap[f.group].push(f);
    });

    const sectionIcons = {
      '通用':'🧭','行前 · 规划对话':'💬','行前 · 决策卡片':'🃏','行前 · 导游选择':'🎭','行前 · 闭环':'✅',
      '行中 · 导览工作台':'🗺️','行中 · 形态与触达':'📱','行中 · 商业触达':'🎁','行中 · 行程管理':'📋',
      '行后 · 收获展示':'🎁','行后 · 知识沉淀':'🧠','行后 · 扩展占位':'✨','商城 · 文创消费':'🛍️'
    };
    const sectionDesc = {
      '通用': mode === 'plan' ? '用户身份与应用框架' : '全局壳层与数据路由',
      '行前 · 规划对话': mode === 'plan' ? 'AI 定制师对话体验' : 'pretrip 脚本引擎',
      '行前 · 决策卡片': mode === 'plan' ? '结构化决策信息卡片' : 'renderCard 八类 subtype',
      '行前 · 导游选择': mode === 'plan' ? '行中导游预选与付费档位' : 'guides 数据与弹窗',
      '行前 · 闭环': mode === 'plan' ? '规划完成确认' : '行程卡与完成弹窗',
      '行中 · 导览工作台': mode === 'plan' ? '景区陪伴核心体验（含子能力）' : 'during 多模块联动',
      '行中 · 形态与触达': mode === 'plan' ? '多形态交互与导游触达' : 'mode-switcher 与弹窗',
      '行中 · 商业触达': mode === 'plan' ? '游览中商业转化' : '文创弹窗组件',
      '行中 · 行程管理': mode === 'plan' ? '多段行程切换' : '行程选择器',
      '行后 · 收获展示': mode === 'plan' ? '旅行成果可视化' : 'harvest-current 渲染',
      '行后 · 知识沉淀': mode === 'plan' ? '认知地图与档案' : 'knowledgeTree 聚合',
      '行后 · 扩展占位': mode === 'plan' ? '未来 IoT 等入口' : '空函数占位',
      '商城 · 文创消费': mode === 'plan' ? '文创购买闭环演示' : 'SHOP_DATA 与购物车'
    };

    let html = '<div class="tree-root">';
    GROUP_ORDER.forEach(group => {
      const roots = sectionMap[group];
      if (!roots.length) return;
      html += '<div class="tree-section">';
      html += '<div class="section-head"><span class="section-icon">' + (sectionIcons[group]||'📦') + '</span>';
      html += '<div><div class="section-title">' + group + '</div>';
      html += '<div class="section-desc">' + (sectionDesc[group]||'') + '</div></div></div>';
      roots.forEach(f => {
        html += renderFeatItem(f, mode);
        const children = FEATURES.filter(c => c.parent === f.id);
        if (children.length) {
          html += '<div class="children">';
          children.forEach(c => { html += renderFeatItem(c, mode); });
          html += '</div>';
        }
      });
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderTable() {
    const cols = ['ID','功能名称','Tab','分组','父功能','复杂度','状态','策划功能点','技术功能点','代码锚点'];
    let html = '<div class="table-wrap"><table id="featTable"><thead><tr>';
    cols.forEach(c => { html += '<th>' + c + '</th>'; });
    html += '</tr></thead><tbody>';
    FEATURES.forEach(f => {
      const parentName = f.parent ? (FEATURES.find(p => p.id === f.parent)||{}).name || f.parent : '';
      html += '<tr>';
      html += '<td>' + f.id + '</td>';
      html += '<td><b>' + f.name + '</b></td>';
      html += '<td>' + f.tab + '</td>';
      html += '<td>' + f.group + '</td>';
      html += '<td>' + parentName + '</td>';
      html += '<td>' + f.complexity + '</td>';
      html += '<td>' + STATUS_LABEL[f.status] + '</td>';
      html += '<td class="cell-points">' + f.planning.join('；') + '</td>';
      html += '<td class="cell-points">' + f.technical.join('；') + '</td>';
      html += '<td class="cell-points" style="font-family:monospace;font-size:11px">' + f.anchor + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }

  function renderSummary() {
    const total = FEATURES.length;
    const done = FEATURES.filter(f => f.status === 'done').length;
    const roots = FEATURES.filter(f => !f.parent).length;
    const complex = FEATURES.filter(f => f.complexity === '复').length;
    return '<div><div class="summary-num">' + total + '</div><div class="summary-lbl">功能点总数</div></div>'
      + '<div><div class="summary-num">' + roots + '</div><div class="summary-lbl">一级功能</div></div>'
      + '<div><div class="summary-num">' + done + '</div><div class="summary-lbl">已完成</div></div>'
      + '<div><div class="summary-num">' + complex + '</div><div class="summary-lbl">高复杂</div></div>';
  }

  function copyTsv() {
    const header = ['ID','功能名称','Tab','分组','父功能','复杂度','状态','策划功能点','技术功能点','代码锚点'];
    const rows = FEATURES.map(f => {
      const parentName = f.parent ? (FEATURES.find(p => p.id === f.parent)||{}).name || '' : '';
      return [f.id, f.name, f.tab, f.group, parentName, f.complexity, STATUS_LABEL[f.status],
        f.planning.join('；'), f.technical.join('；'), f.anchor];
    });
    const tsv = [header, ...rows].map(r => r.map(c => String(c).replace(/\t/g,' ').replace(/\n/g,' ')).join('\t')).join('\n');
    navigator.clipboard.writeText(tsv).then(() => alert('已复制 ' + FEATURES.length + ' 行到剪贴板，可粘贴到 Excel / 飞书表格'));
  }

  document.getElementById('panel-plan').innerHTML = renderTree('plan');
  document.getElementById('panel-tech').innerHTML = renderTree('tech');
  document.getElementById('panel-table').innerHTML = renderTable();
  document.getElementById('summaryBar').innerHTML = renderSummary();

  document.querySelectorAll('.view-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.view-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.view).classList.add('active');
    });
  });
  document.getElementById('btnCopyTsv').addEventListener('click', copyTsv);
  </script>
</body>
</html>
